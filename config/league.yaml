  weeks: [16, 17]
  higher_seed_wins_ties: true
  reseed: false

rules:
  divisions: false
  lock_eliminated_teams: false
  play_against_median: false
  second_opponent: false
  postponed_games_receive_injured_status: false
  lock_benched_players: false
  invite_permissions: all_managers
