[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-draft-ai"
version = "0.1.0"
description = "A reliable, configurable live fantasy-football draft copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
fantasy-draft = "fantasy_draft.cli:main"
fantasy-draft-import = "fantasy_draft.player_cli:main"

[tool.setuptools.packages.find]
include = ["fantasy_draft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
